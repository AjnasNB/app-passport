name: AppPassport
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run fixtures
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
